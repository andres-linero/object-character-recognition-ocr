[project]
name = "ocr-workspace"
version = "0.1.0"
description = "Order tracking, document OCR, and relational data ingestion"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pymupdf>=1.24",
  "pandas>=2.0", "openpyxl>=3.1", "python-dotenv>=1.0", "pillow>=10.0",
  "azure-ai-documentintelligence>=1.0", "azure-core>=1.30",
]

[dependency-groups]
dev = [
  "pytest>=8", "httpx>=0.27,<1", "ruff==0.17.4", "pre-commit>=4,<5",
  "streamlit>=1.37", "msal>=1.28", "altair>=5",
  "azure-identity>=1.15", "azure-keyvault-secrets>=4.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
exclude = [".venv", "web/node_modules", "demo_data", "demo_batches", "demo_runtime"]

[tool.ruff.lint]
# Initial gate: Python syntax, imports, undefined names and unused code.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Entrypoints bootstrap the repo path/configuration before application imports.
"scripts/*.py" = ["E402"]
"ADK_Agentic/streamlit_app.py" = ["E402"]
"ADK_Agentic/demo_app.py" = ["E402"]
